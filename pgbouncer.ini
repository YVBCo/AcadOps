[databases]
academic_ops = host=postgres port=5432 dbname=academic_ops

[pgbouncer]
; Connection pooling mode: transaction (most efficient, industry standard)
pool_mode = transaction

; Listening port for PgBouncer
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Pool sizing (tuned for 50k+ users)
; max_client_conn: max simultaneous client connections PgBouncer will accept
; At 50k users, ~1-2% concurrent = 500-1000 active connections
max_client_conn = 2000
; default_pool_size: server connections per user/database pair
default_pool_size = 50
; min_pool_size: keep this many server connections warm at all times
min_pool_size = 10
; reserve_pool_size: extra connections under burst load
reserve_pool_size = 20
; reserve_pool_timeout: how long to wait before using reserve pool (seconds)
reserve_pool_timeout = 3
; server_round_robin: distribute queries evenly across pool connections
server_round_robin = 1

; Timeouts
; server_idle_timeout: close idle server connections after this many seconds
server_idle_timeout = 600
; client_idle_timeout: close idle client connections (prevents connection leaks)
client_idle_timeout = 300
; query_timeout: max time a query can run, 0 = disabled (let app handle)
query_timeout = 0
; server_connect_timeout: timeout for connecting to PostgreSQL
server_connect_timeout = 15
; server_lifetime: max age of server connection (seconds), prevents stale connections
server_lifetime = 3600
; server_check_delay: how often to run server health checks (seconds)
server_check_delay = 30

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

; Admin access
admin_users = postgres
stats_users = postgres
