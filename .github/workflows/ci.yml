name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-test:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: academic_ops_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academic_ops_test?schema=public
      JWT_SECRET: test-secret-that-is-at-least-64-characters-long-for-ci-pipeline-testing-only!!
      JWT_REFRESH_SECRET: test-refresh-secret-that-is-at-least-64-characters-long-for-ci-testing-only!!
      JWT_EXPIRES_IN: 15m
      REDIS_URL: redis://localhost:6379
      ALLOWED_ORIGINS: http://localhost:3000
      NODE_ENV: test
      LOG_LEVEL: silent

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd server && npx prisma generate

      - name: Lint (client)
        run: npm run lint --workspace=client

      - name: Build server
        run: npm run build --workspace=server

      - name: Build client
        run: npm run build --workspace=client

      - name: Run server tests
        run: npm run test --workspace=server --if-present
