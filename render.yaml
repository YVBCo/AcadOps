# =============================================================================
# Render Blueprint — Infrastructure as Code
# Deploy server (Express API) only — Frontend is on Netlify
# =============================================================================

services:
  # ─── Backend API (Express + Prisma) ──────────────────────
  - type: web
    name: acadops-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: ./
    buildCommand: cd server && npm install && npx prisma generate && npx tsc --project tsconfig.json
    startCommand: cd server && node dist/src/index.js
    # The root health endpoint runs before API authentication and checks the DB/cache.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: "15m"
      - key: JWT_REFRESH_EXPIRES_IN
        value: "7d"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LOG_LEVEL
        value: info

